name: Daily post

on:
  schedule:
    - cron: "30 3 * * *"   # 03:30 UTC = 09:00 IST. Change to your time zone.
  workflow_dispatch:
    inputs:
      news:
        description: "Force a tech-news angle"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write   # for the free one-tap mode

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generate (and optionally publish) posts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_USERNAME: ${{ vars.GH_USERNAME || github.repository_owner }}
          GH_TOKEN: ${{ secrets.GH_ACTIVITY_TOKEN || secrets.GITHUB_TOKEN }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          AUTHOR_BIO: ${{ vars.AUTHOR_BIO }}
          NEWS_PROBABILITY: ${{ vars.NEWS_PROBABILITY || '0.3' }}
          INCLUDE_PRIVATE_REPOS: ${{ vars.INCLUDE_PRIVATE_REPOS || 'false' }}
          AUTO_POST_X: ${{ vars.AUTO_POST_X || 'true' }}
          X_MODE: ${{ vars.X_MODE || 'api' }}           # 'manual' = free one-tap link via issue
          ISSUE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOWERCASE: ${{ vars.LOWERCASE || 'true' }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          AUTO_POST_LINKEDIN: ${{ vars.AUTO_POST_LINKEDIN || 'true' }}
          LINKEDIN_MODE: ${{ vars.LINKEDIN_MODE || 'api' }}   # 'manual' = free one-tap link via issue
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: python bot.py ${{ github.event.inputs.news == 'true' && '--news' || '' }}
      - name: Commit drafts
        if: always()
        run: |
          git config user.name "post-bot"
          git config user.email "post-bot@users.noreply.github.com"
          git add posts history.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Daily post $(date -u +%F)"
          git push
